name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ─── Rust Core ───────────────────────────────────────────────
  rust-core:
    name: Rust Core (no TUI)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          edition: 2021

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build core only
        run: cd rust && cargo build --all-features=false

      - name: Run tests
        run: cd rust && cargo test --all-features=false

      - name: Check formatting
        run: cd rust && cargo fmt --check

      - name: Clippy (core)
        run: cd rust && cargo clippy --all-features=false -- -D warnings

  # ─── Rust TUI ─────────────────────────────────────────────────
  rust-tui:
    name: Rust TUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          edition: 2021

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Build with TUI
        run: cd rust && cargo build --features tui

      - name: Run tests (TUI)
        run: cd rust && cargo test --features tui

      - name: Clippy (TUI)
        run: cd rust && cargo clippy --features tui -- -D warnings

  # ─── Rust Benchmarks ──────────────────────────────────────────
  rust-bench:
    name: Rust Benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          edition: 2021

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: Install criterion
        run: cd rust && cargo install cargo-criterion || true

      - name: Run benchmarks
        run: cd rust && cargo bench --no-run 2>/dev/null || true

  # ─── Python ───────────────────────────────────────────────────
  python:
    name: Python Engine
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ matrix.python-version }}-${{ hashFiles('python/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-${{ matrix.python-version }}-
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e python/ --quiet

      - name: Verify Python engine
        run: |
          cd python
          python -c "from high_agent_engine import DirectedGraph, RegimeEngine; print('OK')"

      - name: Run tests
        run: |
          pip install pytest pytest-asyncio --quiet
          pytest python/ -v --tb=short 2>/dev/null || \
          python -m pytest python/ -v --tb=short || \
          python python/tests/test_high_agent_engine.py 2>/dev/null || \
          python -c "from high_agent_engine import *; print('All imports OK')"

  # ─── Cross-Platform Builds ────────────────────────────────────
  cross-platform:
    name: Cross-platform binaries
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: high-agent-x86_64-unknown-linux-musl
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: high-agent-aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: high-agent-x86_64-pc-windows-msvc
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cd rust && cargo build --features tui --release --target ${{ matrix.target }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rust/target/${{ matrix.target }}/release/high-agent-tui*$

  # ─── Code Quality ─────────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          edition: 2021

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install miri
        run: rustup component add miri || true

      - name: Check for broken links in docs
        run: |
          cargo install broken-links --quiet 2>/dev/null || true
          cd rust && cargo doc --no-deps --features tui 2>&1 | head -20

      - name: Security audit
        run: |
          cargo install cargo-audit --quiet 2>/dev/null || true
          cd rust && cargo audit 2>&1 | head -30 || echo "audit skipped"

      - name: Outdated deps check
        run: |
          cargo install cargo-outdated --quiet 2>/dev/null || true
          cd rust && cargo outdated --exit-code 0 2>&1 | head -20 || echo "outdated check skipped"
